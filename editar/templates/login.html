<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;  /* Soft background color for a calm appearance */
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 300px;  /* Limit the width */
        }

        h2 {
            color: #333;  /* Darker color for better readability */
        }

        input {
            width: 90%;  /* Input fields span most of the container's width */
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;  /* Lighter border for input fields */
            border-radius: 5px;  /* Slightly rounded corners */
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;  /* Green for success */
            color: white;  /* White text on the button */
            border: none;
            border-radius: 5px;
            cursor: pointer;  /* Cursor changes to pointer on hover */
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;  /* Darker green on hover */
        }

        .error-message {
            color: red;  /* Red for error messages */
        }
    </style>
</head>
<body>
    <div class="login-container">  <!-- Centralized login form -->
        <h2>Admin Login</h2>
        <form action="/login" method="post">
            <input type="text" name="username" id="username" placeholder="Username" required>  <!-- Placeholder text -->
            <input type="password" name="password" id="password" placeholder="Password" required>
            <input type="hidden" name="type" value="{{ login_type }}"><br>  <!-- Make sure this is correctly set -->
            <button type="submit">Login</button>  <!-- Styled login button -->

            <!-- Display error message if provided -->
            {% if error %}
              <p class="error-message">{{ error }}</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
